<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>
html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans)}
.main{width:75%;background:var(--primary);display:flex;align-items:center;justify-content:center;padding:0 70px}
.name{color:var(--primary-foreground);font-weight:600;letter-spacing:-.03em;line-height:.95;font-size:150px;text-align:center}
.mark{color:var(--primary-foreground);margin-bottom:40px}
.stack{display:flex;flex-direction:column;align-items:center}
.strip{width:25%;display:flex;flex-direction:column}
.strip>div{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main"><div class="stack"><svg class="mark" width="230" height="230" viewBox="0 0 48 48" fill="none"><path d="M35 15 A13 13 0 1 0 35 33" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/></svg><div class="name">Creator<br>Commerce</div></div></div>
  <div class="strip">
    <div style="background:var(--chart-1)"></div>
    <div style="background:var(--chart-2)"></div>
    <div style="background:var(--chart-3)"></div>
    <div style="background:var(--chart-5)"></div>
  </div>
</div>
</body></html>
