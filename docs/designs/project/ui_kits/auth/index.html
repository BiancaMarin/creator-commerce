<!-- @dsCard group="Auth" viewport="900x620" name="Sign in / Sign up" subtitle="Centered auth card · password toggle · OAuth" -->
<!-- @startingPoint section="Auth" subtitle="Login / signup card screen" viewport="900x620" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Creator Commerce — Sign in</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%;margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans)}a{color:var(--primary)}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const { useState } = React;
const S = window.CreatorCommerceDesignSystem_8efbba;
const { Button, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Input, Separator } = S;

function Field({ label, children, error }){
  return (<div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <label style={{fontSize:14,fontWeight:500}}>{label}</label>
      {label==="Password" && <a href="#" style={{fontSize:12,fontWeight:500,color:"var(--muted-foreground)",textDecoration:"none"}}>Forgot password?</a>}
    </div>
    {children}
    {error && <p style={{margin:0,fontSize:12,color:"var(--destructive)"}}>{error}</p>}
  </div>);
}

function App(){
  const [mode,setMode]=useState("login");
  const [show,setShow]=useState(false);
  const [email,setEmail]=useState("");
  const [err,setErr]=useState(false);
  const isSignup = mode==="signup";
  const submit=(e)=>{e.preventDefault(); setErr(!/^[^@]+@[^@]+\.[^@]+$/.test(email));};
  return (
    <div style={{minHeight:"100%",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{display:"flex",flexDirection:"column",gap:24,width:"100%",maxWidth:384}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,textAlign:"center"}}>
          <span style={{display:"flex",width:44,height:44,alignItems:"center",justifyContent:"center",borderRadius:"var(--radius-2xl)",background:"var(--primary)",color:"var(--primary-foreground)"}}><svg width="22" height="22" viewBox="0 0 48 48" fill="none"><path d="M35 15 A13 13 0 1 0 35 33" stroke="currentColor" strokeWidth="4.4" strokeLinecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="currentColor" strokeWidth="4.4" strokeLinecap="round"/></svg></span>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <h1 style={{margin:0,fontFamily:"var(--font-heading)",fontSize:"var(--text-xl)",fontWeight:600,letterSpacing:"-.02em"}}>{isSignup?"Create your account":"Welcome back"}</h1>
            <p style={{margin:0,fontSize:14,color:"var(--muted-foreground)"}}>{isSignup?"Start selling digital products in minutes.":"Sign in to your Creator Commerce workspace."}</p>
          </div>
        </div>
        <Card>
          <CardHeader>
            <CardTitle>{isSignup?"Sign Up":"Sign In"}</CardTitle>
            <CardDescription>{isSignup?"Enter your details to get started.":"Enter your email and password to continue."}</CardDescription>
          </CardHeader>
          <CardContent>
            <form onSubmit={submit} noValidate style={{display:"flex",flexDirection:"column",gap:16}}>
              {isSignup && <Field label="Name"><Input placeholder="Jane Creator" autoComplete="name"/></Field>}
              <Field label="Email" error={err?"Please enter a valid email address.":null}>
                <Input type="email" placeholder="you@example.com" value={email} aria-invalid={err} onChange={(e)=>setEmail(e.target.value)}/>
              </Field>
              <Field label="Password">
                <div style={{position:"relative"}}>
                  <Input type={show?"text":"password"} placeholder="••••••••" style={{paddingRight:40}}/>
                  <Button type="button" variant="ghost" size="icon-sm" aria-label="Toggle password" onClick={()=>setShow(s=>!s)} style={{position:"absolute",top:"50%",right:4,transform:"translateY(-50%)",color:"var(--muted-foreground)"}}><i className={"ph "+(show?"ph-eye-slash":"ph-eye")}></i></Button>
                </div>
              </Field>
              <Button type="submit" style={{width:"100%"}}>{isSignup?"Create account":"Sign in"}</Button>
            </form>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"16px 0"}}>
              <Separator style={{flex:1}}/><span style={{fontSize:12,color:"var(--muted-foreground)"}}>or continue with</span><Separator style={{flex:1}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Button variant="outline"><i className="ph ph-google-logo"></i>Google</Button>
              <Button variant="outline"><i className="ph ph-github-logo"></i>GitHub</Button>
            </div>
          </CardContent>
          <CardFooter style={{justifyContent:"center",borderTop:"1px solid var(--border)",paddingTop:"var(--card-spacing)",fontSize:14,color:"var(--muted-foreground)"}}>
            {isSignup?"Already have an account?":"Don't have an account?"}
            <a href="#" onClick={(e)=>{e.preventDefault();setMode(isSignup?"login":"signup");setErr(false);}} style={{marginLeft:6,fontWeight:500,color:"var(--foreground)",textDecoration:"none"}}>{isSignup?"Sign in":"Sign Up"}</a>
          </CardFooter>
        </Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
