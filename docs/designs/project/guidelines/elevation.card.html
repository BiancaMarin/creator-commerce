<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Card = shadow-md + hairline ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--muted);color:var(--foreground)}
.wrap{padding:24px;display:flex;gap:18px}
.col{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
.bx{width:100%;height:70px;background:var(--card);border-radius:var(--radius-2xl)}
.m{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head>
<body><div class="wrap">
<div class="col"><div class="bx" style="box-shadow:var(--shadow-xs)"></div><span class="m">shadow-xs</span></div>
<div class="col"><div class="bx" style="box-shadow:var(--shadow-sm)"></div><span class="m">shadow-sm</span></div>
<div class="col"><div class="bx" style="box-shadow:var(--shadow-md),var(--ring-hairline)"></div><span class="m">shadow-md + ring (card)</span></div>
<div class="col"><div class="bx" style="box-shadow:var(--shadow-lg)"></div><span class="m">shadow-lg</span></div>
</div></body></html>
