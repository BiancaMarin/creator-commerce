<!-- @dsCard group="Colors" viewport="700x150" name="Brand primary" subtitle="Teal --primary and its foreground" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{display:flex;gap:14px;padding:20px}
.sw{flex:1;border-radius:var(--radius-2xl);padding:14px;height:78px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px oklch(0 0 0/.06)}
.n{font-size:13px;font-weight:600}.v{font-size:11px;opacity:.8;font-family:var(--font-mono)}</style></head>
<body><div class="wrap">
<div class="sw" style="background:var(--primary);color:var(--primary-foreground)"><span class="n">primary</span><span class="v">oklch(0.52 0.105 223)</span></div>
<div class="sw" style="background:var(--primary-foreground);color:var(--primary)"><span class="n">primary-foreground</span><span class="v">oklch(0.984 0.019 200)</span></div>
</div></body></html>
