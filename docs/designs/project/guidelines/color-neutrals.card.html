<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals (mauve)" subtitle="Surfaces, text, borders — mauve-tinted" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{display:flex;gap:10px;padding:20px}
.sw{flex:1;border-radius:var(--radius-xl);height:82px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:inset 0 0 0 1px var(--border)}
.n{font-size:11px;font-weight:600}.v{font-size:10px;color:var(--muted-foreground);font-family:var(--font-mono)}</style></head>
<body><div class="wrap">
<div class="sw" style="background:var(--background)"><span class="n">background</span></div>
<div class="sw" style="background:var(--secondary)"><span class="n">secondary</span></div>
<div class="sw" style="background:var(--muted)"><span class="n">muted / accent</span></div>
<div class="sw" style="background:var(--muted-foreground)"><span class="n" style="color:#fff">muted-fg</span></div>
<div class="sw" style="background:var(--foreground)"><span class="n" style="color:#fff">foreground</span></div>
</div></body></html>
