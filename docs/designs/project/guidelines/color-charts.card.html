<!-- @dsCard group="Colors" viewport="700x140" name="Data-viz ramp" subtitle="Lime → deep green, chart-1…5" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{display:flex;padding:20px;gap:0;border-radius:var(--radius-2xl);overflow:hidden;margin:20px;box-shadow:inset 0 0 0 1px var(--border)}
.wrap{padding:0}
.sw{flex:1;height:88px;display:flex;align-items:flex-end;padding:8px}
.n{font-size:10px;font-weight:600;font-family:var(--font-mono)}</style></head>
<body><div class="wrap">
<div class="sw" style="background:var(--chart-1)"><span class="n">chart-1</span></div>
<div class="sw" style="background:var(--chart-2)"><span class="n">chart-2</span></div>
<div class="sw" style="background:var(--chart-3)"><span class="n" style="color:#fff">chart-3</span></div>
<div class="sw" style="background:var(--chart-4)"><span class="n" style="color:#fff">chart-4</span></div>
<div class="sw" style="background:var(--chart-5)"><span class="n" style="color:#fff">chart-5</span></div>
</div></body></html>
