<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="0.25rem base step" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{padding:20px;display:flex;align-items:flex-end;gap:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--primary);border-radius:var(--radius-sm);width:26px}
.m{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head>
<body><div class="wrap">
<div class="col"><div class="bar" style="height:8px"></div><span class="m">2</span></div>
<div class="col"><div class="bar" style="height:16px"></div><span class="m">4</span></div>
<div class="col"><div class="bar" style="height:24px"></div><span class="m">6</span></div>
<div class="col"><div class="bar" style="height:32px"></div><span class="m">8·sm pad</span></div>
<div class="col"><div class="bar" style="height:48px"></div><span class="m">12</span></div>
<div class="col"><div class="bar" style="height:64px"></div><span class="m">16</span></div>
<div class="col"><div class="bar" style="height:96px"></div><span class="m">24·card pad</span></div>
</div></body></html>
