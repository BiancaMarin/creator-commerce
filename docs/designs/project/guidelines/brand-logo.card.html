<!-- @dsCard group="Brand" viewport="700x260" name="Logo" subtitle="Nested-C monogram · lockup · variants · favicon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{padding:24px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:22px}
.tile{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-2xl)}
.lock{display:flex;align-items:center;gap:14px}
.word{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.chip{display:flex;align-items:center;justify-content:center;padding:16px;border-radius:var(--radius-2xl)}
.cap{font-size:11px;color:var(--muted-foreground);margin-top:8px;text-align:center}
.col{display:flex;flex-direction:column;align-items:center}</style></head>
<body><div class="wrap">
<div class="row">
  <span class="tile" style="width:52px;height:52px;background:var(--primary)"><svg width="30" height="30" viewBox="0 0 48 48" fill="none"><path d="M35 15 A13 13 0 1 0 35 33" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/></svg></span>
  <div class="word">Creator Commerce</div>
</div>
<div class="row" style="gap:16px">
  <div class="col"><span class="chip" style="background:var(--primary)"><svg width="30" height="30" viewBox="0 0 48 48" fill="none"><path d="M35 15 A13 13 0 1 0 35 33" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/></svg></span><span class="cap">on primary</span></div>
  <div class="col"><span class="chip" style="background:var(--muted)"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" style="color:var(--primary)"><path d="M35 15 A13 13 0 1 0 35 33" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/></svg></span><span class="cap">teal on muted</span></div>
  <div class="col"><span class="chip" style="background:var(--foreground)"><svg width="30" height="30" viewBox="0 0 48 48" fill="none"><path d="M35 15 A13 13 0 1 0 35 33" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/><path d="M31 21 A6.5 6.5 0 1 0 31 27" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/></svg></span><span class="cap">reversed</span></div>
  <div class="col"><span class="chip" style="background:var(--primary)"><svg width="18" height="18" viewBox="0 0 48 48" fill="none"><path d="M34 17 A11 11 0 1 0 34 31" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></span><span class="cap">favicon 16px</span></div>
</div>
</div></body></html>
