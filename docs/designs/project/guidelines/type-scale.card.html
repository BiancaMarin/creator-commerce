<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="xs → 3xl, tracking-tight on headings" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{padding:20px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:baseline;gap:14px}
.t{white-space:nowrap}.m{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
.h{font-weight:600;letter-spacing:-.02em}</style></head>
<body><div class="wrap">
<div class="row"><span class="t h" style="font-size:var(--text-3xl)">Creator Commerce</span><span class="m">3xl / 30 · semibold</span></div>
<div class="row"><span class="t h" style="font-size:var(--text-2xl)">Dashboard title</span><span class="m">2xl / 24 · semibold</span></div>
<div class="row"><span class="t h" style="font-size:var(--text-xl)">Card / auth title</span><span class="m">xl / 20 · semibold</span></div>
<div class="row"><span class="t" style="font-size:var(--text-base);font-weight:500">Card title medium</span><span class="m">base / 16 · medium</span></div>
<div class="row"><span class="t" style="font-size:var(--text-sm)">Body & UI default text</span><span class="m">sm / 14 · regular</span></div>
<div class="row"><span class="t" style="font-size:var(--text-xs);color:var(--muted-foreground)">Meta / helper text</span><span class="m">xs / 12 · muted</span></div>
</div></body></html>
