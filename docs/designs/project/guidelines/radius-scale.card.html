<!-- @dsCard group="Spacing" viewport="700x180" name="Radius scale" subtitle="Soft & rounded — up to 4xl on cards/buttons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
.wrap{padding:20px;display:flex;gap:14px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bx{width:64px;height:64px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.m{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head>
<body><div class="wrap">
<div class="col"><div class="bx" style="border-radius:var(--radius-sm)"></div><span class="m">sm</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-md)"></div><span class="m">md</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-lg)"></div><span class="m">lg·base</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-2xl)"></div><span class="m">2xl</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-3xl)"></div><span class="m">3xl·input</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-4xl)"></div><span class="m">4xl·card/btn</span></div>
<div class="col"><div class="bx" style="border-radius:var(--radius-full)"></div><span class="m">full·pill</span></div>
</div></body></html>
